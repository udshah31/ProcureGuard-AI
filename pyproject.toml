[project]
name = "procurement-agent"
version = "0.1.0"
description = "A LangGraph-powered procurement automation agent with local HuggingFace LLM inference."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # managed via requirements.txt for now

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
